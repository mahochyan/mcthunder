; WT-036-R1 user authorisation E1: dedicated server and client build variants. Everything matches the
; proven "Windows Release" template; the differences are the role tag, the dedicated_server flag for
; the headless server build and separate export paths that mirror the existing START_LOCAL_SERVER /
; START_LOCAL_CLIENT launchers (scripts/network/server_main.gd and client_main.gd). backups/ is
; gitignored, so these builds stay out of version control.
[preset.3]
name="Windows Server"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=true
custom_features="server"
export_filter="all_resources"
include_filter="configs/**/*.json,assets/**/*.json,assets/fonts/OFL.txt,assets/research/models/*.glb,assets/research/thumbnails/*.png"
exclude_filter="docs/*,logs/*,backups/*,builds/*,tools/*,order/*,authoring/*,deliverables/*,dev_tools/*,tests/*,assets/reference_data/*,*.blend,*.blend1,*.py,*.ps1,*.zip,*.bat,*.md"
export_path="backups/builds/PixelArmorServer.exe"
script_export_mode=2

[preset.3.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
debug/export_console_wrapper=1
application/product_name="PixelArmorServer"
application/file_description="PixelArmor dedicated server"
application/file_version="0.3.3.0"
application/product_version="0.3.3"

